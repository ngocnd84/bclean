name: Android – build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build test APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Bclean-test-${{ github.run_number }}.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Bclean-android-test-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Release "android-test"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test dist/*.apk \
            --title "Bclean Android – bản test #${{ github.run_number }}" \
            --notes "Bản test (debug) build tự động từ commit ${GITHUB_SHA::7}. Cài trên Android 11 trở lên: mở file APK, cho phép 'Cài ứng dụng không rõ nguồn gốc'." \
            --prerelease
