name: Android – build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (có sẵn trên runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build test APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Bclean-test-${{ github.run_number }}.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Bclean-android-test-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Release "android-test"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test dist/*.apk \
            --title "Bclean Android – bản test #${{ github.run_number }}" \
            --notes "Bản test (debug) build tự động từ commit ${GITHUB_SHA::7}. Cài trên Android 11 trở lên: mở file APK, cho phép 'Cài ứng dụng không rõ nguồn gốc'." \
            --prerelease

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Bclean-android-test-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-smoke.sh

      - name: Attach screenshots to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la shots || exit 0
          gh release upload android-test shots/*.png --clobber || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-results
          path: shots/
          retention-days: 7
