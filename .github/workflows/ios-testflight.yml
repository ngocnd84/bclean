name: iOS – TestFlight (chạy tay)

# Cần 4 secrets trong Settings > Secrets and variables > Actions:
#   APPLE_TEAM_ID      Team ID 10 ký tự (developer.apple.com > Membership)
#   ASC_KEY_ID         Key ID của App Store Connect API key (quyền Admin)
#   ASC_ISSUER_ID      Issuer ID (App Store Connect > Users and Access > Integrations)
#   ASC_KEY_P8_BASE64  Nội dung file AuthKey_XXXX.p8 mã hoá base64
# Và app vn.bentic.bclean đã được tạo trên App Store Connect.

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Prepare API key
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_B64" | base64 --decode > ~/private_keys/AuthKey.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Bclean.xcodeproj -scheme Bclean -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Bclean.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40

      - name: Upload to TestFlight
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Bclean.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "✅ Đã đẩy lên App Store Connect. Khoảng 10–30 phút sau bản build xuất hiện trong TestFlight."
